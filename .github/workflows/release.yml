# On a version tag (v*), build every package's source tarball and attach
# them to a GitHub release. Consumers can then install a pinned version,
# e.g.:
#   install.packages("https://github.com/WyattAu/uofg_r_mono/releases/download/v0.1.0/uofgcore_0.1.0.tar.gz",
#                    repos = NULL, type = "source")

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libuv1-dev libhunspell-dev

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-renv@v2

      - name: Build all packages
        run: Rscript scripts/build-all.R

      - name: Build source tarballs
        run: |
          mkdir -p release
          Rscript -e 'for (p in sort(list.dirs("packages", recursive = FALSE))) { message("building ", basename(p)); writeLines(pkgbuild::build(p, dest_path = "release", vignettes = FALSE)) }'

      - name: Create GitHub release with tarballs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.tar.gz --generate-notes --title "$GITHUB_REF_NAME"
