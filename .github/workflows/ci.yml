# Build, check, test, lint, style-check, and coverage-gate every package
# in the monorepo.
#
# Relies on renv (restored via r-lib/actions/setup-renv) for the
# toolchain, and on scripts/*.R for the per-package pipelines:
#   build-all.R    document -> test -> R CMD check --as-cran -> install
#   lint-all.R     lintr + spelling
#   style-all.R    styler (CI fails if it would change anything)
#   coverage.R     test coverage with a hard threshold

name: CI

# Stricter R checks: promote classic silent-corruption mistakes to errors.
env:
  _R_CHECK_LENGTH_1_LOGIC2_: true
  _R_CHECK_LENGTH_1_CONDITION_: true
  _R_CHECK_MATRIX_DATA_: true

on:
  push:
    branches: [main]
  pull_request:
  # Monthly check against the current CRAN/R ecosystem; catches bitrot
  # (dead URLs, R release regressions) that push/PR triggers never see.
  schedule:
    - cron: "0 6 1 * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        r-version: ["release", "oldrel-1"]
    steps:
      - uses: actions/checkout@v7

      # System libraries required by binary/source packages in renv.lock:
      #   libuv1        fs links it at runtime; runners do not ship it
      #   libhunspell   spelling (locked) links it; restored in every job
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libuv1-dev libhunspell-dev libmpfr-dev

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}

      - uses: r-lib/actions/setup-renv@v2

      - name: Document, test, check, and install all packages
        run: Rscript scripts/build-all.R

      # build-all.R regenerates NAMESPACE/man/Collate. Any leftover diff
      # means documentation was committed stale.
      - name: Verify generated files are up to date
        run: git diff --exit-code

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libuv1-dev libhunspell-dev libmpfr-dev

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-renv@v2

      # Install the monorepo packages so lintr resolves cross-file
      # symbols (object_usage_linter) exactly as it does locally.
      - name: Install monorepo packages
        run: Rscript -e 'for (p in sort(list.dirs("packages", recursive = FALSE))) renv::install(normalizePath(p), prompt = FALSE)'

      - name: Lint all packages
        run: Rscript scripts/lint-all.R

      - name: Spell-check all packages
        run: Rscript scripts/spellcheck-all.R

  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libuv1-dev libhunspell-dev libmpfr-dev

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-renv@v2

      # Fail if styler would change anything: formatting belongs in the
      # commit, not the review.
      - name: Style all packages and fail on diffs
        run: |
          Rscript scripts/style-all.R
          git diff --exit-code

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libuv1-dev libhunspell-dev libmpfr-dev

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-renv@v2

      # covr loads packages from source; their dependencies -- including
      # other monorepo packages, which are not on CRAN -- must be
      # installed first.
      - name: Install all packages
        run: Rscript scripts/build-all.R

      - name: Coverage gate (threshold from scripts/coverage.R)
        run: Rscript scripts/coverage.R
