# Build, check, and test every package in the monorepo.
#
# Relies on renv (restored via r-lib/actions/setup-renv) for the
# toolchain, and on scripts/build-all.R for the per-package pipeline:
# document -> test -> R CMD check --as-cran -> install.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Monthly check against the current CRAN/R ecosystem; catches bitrot
  # (dead URLs, R release regressions) that push/PR triggers never see.
  schedule:
    - cron: "0 6 1 * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        r-version: ["release", "oldrel-1"]
    steps:
      - uses: actions/checkout@v4

      # System libraries required by binary/source packages in renv.lock
      # (fs links libuv1 at runtime; GitHub runners do not ship it).
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libuv1-dev

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}

      - uses: r-lib/actions/setup-renv@v2

      - name: Document, test, check, and install all packages
        run: Rscript scripts/build-all.R

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libuv1-dev

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-renv@v2

      - name: Lint all packages
        run: Rscript scripts/lint-all.R
