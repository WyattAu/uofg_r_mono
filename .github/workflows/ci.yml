# Build, check, and test every package in the monorepo.
#
# Relies on renv (restored via r-lib/actions/setup-renv) for the
# toolchain, and on scripts/build-all.R for the per-package pipeline:
# document -> test -> R CMD check --as-cran -> install.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-renv@v2

      - name: Document, test, check, and install all packages
        run: Rscript scripts/build-all.R

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-renv@v2

      - name: Lint all packages
        run: Rscript scripts/lint-all.R
