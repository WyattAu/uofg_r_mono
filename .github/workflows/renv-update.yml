# Monthly dependency refresh, fully gated: renv::update() moves every
# locked package to its latest available version, the whole pipeline
# must pass, and only then does this open a PR with the new renv.lock.
# A red run means real CRAN-side breakage -- it pages you instead of
# merging anything.

name: renv-update

on:
  schedule:
    # 1st of each month, 06:00 UTC.
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: renv-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libuv1-dev libhunspell-dev libmpfr-dev

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-renv@v2

      - name: Update all locked packages
        run: Rscript -e 'renv::update(prompt = FALSE)'

      - name: Document, test, check, and install all packages
        run: Rscript scripts/build-all.R

      - name: Lint all packages
        run: Rscript scripts/lint-all.R

      - name: Record the refreshed lockfile
        run: Rscript -e 'renv::snapshot(prompt = FALSE); cat("lockfile updated\n")'

      - name: Create update PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: renv-monthly-update
          delete-branch: true
          commit-message: "chore(deps): monthly renv update"
          title: "Monthly renv update"
          body: |
            Automated monthly dependency refresh.

            - `renv::update()` moved locked packages to their latest
              available versions
            - Full pipeline passed: document, test, `R CMD check --as-cran`,
              lint, install
            - `renv.lock` refreshed via `renv::snapshot()`

            Review the renv.lock diff for major-version jumps before merging.
          labels: |
            dependencies
